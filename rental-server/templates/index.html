<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rental Server</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#090e1b;color:#eef2ff}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{padding:28px 0 10px}.hero h1{margin:0;font-size:38px}.hero p{margin:10px 0;color:#91a2c6}.panel{margin-top:24px;background:#10172a;border:1px solid #23304d;border-radius:18px;padding:18px}.section-title{margin:0 0 10px;font-size:16px;color:#cbd6ef}.create{display:grid;grid-template-columns:2fr 1fr auto;gap:10px}.create input,.create select,.import-row input{background:#0b1222;color:#fff;border:1px solid #293858;border-radius:11px;padding:11px;font:inherit}.btn,button{border:0;border-radius:11px;padding:10px 14px;color:#fff;background:#6574ff;cursor:pointer;font-weight:700;font:inherit}.ghost{background:#202a44}.danger{background:#9c334d}.plan-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:14px 0}.plan-card{position:relative;display:block;background:#0b1222;border:1px solid #293858;border-radius:16px;padding:17px;cursor:pointer;transition:.15s ease}.plan-card:hover{border-color:#6676ff;transform:translateY(-1px)}.plan-card input{position:absolute;opacity:0;pointer-events:none}.plan-card:has(input:checked){border-color:#7b88ff;box-shadow:0 0 0 2px rgba(101,116,255,.18);background:#131c35}.plan-name{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:22px}.check{width:19px;height:19px;border-radius:50%;border:2px solid #506080;display:grid;place-items:center}.plan-card:has(input:checked) .check{border-color:#7b88ff;background:#7b88ff}.plan-card:has(input:checked) .check:after{content:'✓';font-size:12px}.free-label{display:inline-block;margin-top:7px;background:#164f38;color:#93f5bd;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.price{margin-top:10px;font-size:25px;font-weight:900}.price small{font-size:12px;color:#91a2c6;font-weight:600}.plan-spec{margin-top:10px;color:#a9b9d8;font-size:13px;line-height:1.7}.plan-note{margin-top:4px;color:#7184aa;font-size:11px}.notice{margin-top:12px;color:#93a5c9;font-size:12px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:18px}.card{background:#121b31;border:1px solid #263655;border-radius:16px;padding:16px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:19px;font-weight:800}.tag{font-size:12px;background:#243252;padding:5px 8px;border-radius:999px}.plan-badge{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:#cbd4ff;background:#232f5c;padding:5px 8px;border-radius:999px}.meta{color:#9aabc9;font-size:13px;line-height:1.8;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:13px}.logs{white-space:pre-wrap;background:#060a13;border-radius:12px;padding:12px;max-height:240px;overflow:auto;color:#b9c8e7;font-family:ui-monospace,monospace;font-size:12px;margin-top:12px}.status-running{color:#67e8a5}.status-exited,.status-dead{color:#ff8b9f}.empty{color:#91a2c6;text-align:center;padding:35px}.msg{margin-top:12px;padding:10px 12px;border-radius:10px;display:none}.ok{display:block;background:#123b2b;color:#8ff0bb}.err{display:block;background:#4a1f2b;color:#ffb0c0}.keybox{margin-top:12px;background:#0a1020;border:1px solid #263655;border-radius:12px;padding:12px;font-size:12px;color:#a9b9d8}.import-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-top:10px}@media(max-width:1000px){.plan-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.create,.import-row{grid-template-columns:1fr}.plan-grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Rental Server</h1>
    <p>プランを選んで、自分専用のサーバーを作成できます。</p>
  </header>

  <section class="panel">
    <h2 class="section-title">サーバーを作成</h2>
    <div class="create">
      <input id="name" placeholder="server-name (3〜32文字)">
      <select id="template">
        <option value="python-web">Python Web</option>
        <option value="node-web">Node Web</option>
        <option value="nginx">Nginx</option>
      </select>
      <button onclick="createInstance()">このプランで作成</button>
    </div>

    <h2 class="section-title" style="margin-top:20px">容量プラン</h2>
    <div class="plan-grid">
      <label class="plan-card">
        <input type="radio" name="plan" value="free" checked>
        <span class="plan-name">500MB <span class="check"></span></span>
        <span class="free-label">FREE</span>
        <div class="price">¥0 <small>/ 月</small></div>
        <div class="plan-spec">RAM 128MB<br>CPU 0.1</div>
        <div class="plan-note">お試し向け</div>
      </label>
      <label class="plan-card">
        <input type="radio" name="plan" value="small">
        <span class="plan-name">1GB <span class="check"></span></span>
        <div class="price">¥500 <small>/ 月</small></div>
        <div class="plan-spec">RAM 256MB<br>CPU 0.25</div>
        <div class="plan-note">小規模サイト向け</div>
      </label>
      <label class="plan-card">
        <input type="radio" name="plan" value="medium">
        <span class="plan-name">10GB <span class="check"></span></span>
        <div class="price">¥1,500 <small>/ 月</small></div>
        <div class="plan-spec">RAM 512MB<br>CPU 0.5</div>
        <div class="plan-note">小規模アプリ向け</div>
      </label>
      <label class="plan-card">
        <input type="radio" name="plan" value="large">
        <span class="plan-name">50GB <span class="check"></span></span>
        <div class="price">¥2,000 <small>/ 月</small></div>
        <div class="plan-spec">RAM 1GB<br>CPU 1.0</div>
        <div class="plan-note">通常運用向け</div>
      </label>
      <label class="plan-card">
        <input type="radio" name="plan" value="xlarge">
        <span class="plan-name">100GB <span class="check"></span></span>
        <div class="price">¥4,000 <small>/ 月</small></div>
        <div class="plan-spec">RAM 2GB<br>CPU 2.0</div>
        <div class="plan-note">大容量プラン</div>
      </label>
    </div>

    <div class="notice">管理者ログインはありません。サーバー作成時に専用の管理キーを発行し、このブラウザに保存します。</div>
    <div id="message" class="msg"></div>
  </section>

  <section class="panel">
    <h2 class="section-title">このブラウザのサーバー</h2>
    <div id="instances" class="grid"></div>
  </section>

  <section class="panel">
    <h2 class="section-title">管理キーを持っているサーバーを追加</h2>
    <div class="import-row">
      <input id="importName" placeholder="server-name">
      <input id="importKey" placeholder="management key">
      <button class="ghost" onclick="importServer()">追加</button>
    </div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const STORE='rental-server-items-v1';
const PLAN_META={
  free:{name:'500MB',storage:'500MB',price:0,ram:'128MB',cpu:'0.1'},
  small:{name:'1GB',storage:'1GB',price:500,ram:'256MB',cpu:'0.25'},
  medium:{name:'10GB',storage:'10GB',price:1500,ram:'512MB',cpu:'0.5'},
  large:{name:'50GB',storage:'50GB',price:2000,ram:'1GB',cpu:'1.0'},
  xlarge:{name:'100GB',storage:'100GB',price:4000,ram:'2GB',cpu:'2.0'}
};
function yen(v){return `¥${Number(v||0).toLocaleString('ja-JP')}`}
function message(text,ok=false){const el=$('#message');el.textContent=text;el.className='msg '+(ok?'ok':'err');setTimeout(()=>el.className='msg',4500)}
function items(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}}
function save(list){localStorage.setItem(STORE,JSON.stringify(list))}
function remember(name,key){const list=items().filter(x=>x.name!==name);list.push({name,key});save(list)}
function forget(name){save(items().filter(x=>x.name!==name))}
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await r.json().catch(()=>({error:'invalid response'}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function keyFor(name){return items().find(x=>x.name===name)?.key||''}
async function load(){
  const root=$('#instances');const stored=items();
  if(!stored.length){root.innerHTML='<div class="empty">まだサーバーがありません</div>';return}
  const cards=[];
  for(const saved of stored){
    try{
      const data=await api(`/api/instances/${encodeURIComponent(saved.name)}`,{headers:{'X-Instance-Key':saved.key}});
      const i=data.instance;const url=i.host_port?`${location.protocol}//${location.hostname}:${i.host_port}`:null;
      const plan=PLAN_META[i.plan]||{storage:i.storage_gb?`${i.storage_gb}GB`:'-',price:i.price_yen||0,ram:'-',cpu:'-'};
      const storage=i.storage_gb===0.5?'500MB':(i.storage_gb?`${i.storage_gb}GB`:plan.storage);
      cards.push(`<article class="card">
        <div class="line"><span class="name">${esc(i.name)}</span><span class="tag status-${esc(i.status)}">${esc(i.status)}</span></div>
        <span class="plan-badge">${esc(storage)} · ${esc(yen(i.price_yen??plan.price))}/月 · RAM ${esc(plan.ram)} · CPU ${esc(plan.cpu)}</span>
        <div class="meta">Template: ${esc(i.template)}<br>Container: ${esc(i.container_id)}<br>${url?`URL: <a href="${esc(url)}" target="_blank" style="color:#8fa8ff">${esc(url)}</a>`:'URL: -'}</div>
        <div class="actions">
          <button onclick="act('${esc(i.name)}','start')">Start</button>
          <button class="ghost" onclick="act('${esc(i.name)}','stop')">Stop</button>
          <button class="ghost" onclick="act('${esc(i.name)}','restart')">Restart</button>
          <button class="ghost" onclick="showLogs('${esc(i.name)}')">Logs</button>
          <button class="danger" onclick="removeInstance('${esc(i.name)}')">Delete</button>
        </div>
        <div class="keybox">管理キーはこのブラウザに保存されています。</div>
        <div id="logs-${esc(i.name)}" class="logs" style="display:none"></div>
      </article>`);
    }catch(e){cards.push(`<article class="card"><div class="name">${esc(saved.name)}</div><div class="meta">読み込み失敗: ${esc(e.message)}</div><button class="danger" onclick="forgetServer('${esc(saved.name)}')">この端末から削除</button></article>`)}
  }
  root.innerHTML=cards.join('');
}
async function createInstance(){
  const name=$('#name').value.trim().toLowerCase();const plan=document.querySelector('input[name="plan"]:checked')?.value||'free';
  try{
    const data=await api('/api/instances',{method:'POST',body:JSON.stringify({name,template:$('#template').value,plan})});
    remember(data.instance.name,data.manage_key);$('#name').value='';const p=PLAN_META[plan];message(`${p.name}・${yen(p.price)}/月プランで作成しました`,true);await load();
  }catch(e){message(e.message)}
}
async function act(name,action){const key=keyFor(name);try{await api(`/api/instances/${encodeURIComponent(name)}/${action}`,{method:'POST',headers:{'X-Instance-Key':key}});await load()}catch(e){message(e.message)}}
async function removeInstance(name){if(!confirm(`${name} を削除しますか？`))return;const key=keyFor(name);try{await api(`/api/instances/${encodeURIComponent(name)}`,{method:'DELETE',headers:{'X-Instance-Key':key}});forget(name);message('削除しました',true);await load()}catch(e){message(e.message)}}
async function showLogs(name){const key=keyFor(name);try{const d=await api(`/api/instances/${encodeURIComponent(name)}/logs`,{headers:{'X-Instance-Key':key}});const el=document.getElementById(`logs-${name}`);el.style.display='block';el.textContent=d.logs||'(no logs)'}catch(e){message(e.message)}}
async function importServer(){const name=$('#importName').value.trim().toLowerCase();const key=$('#importKey').value.trim();if(!name||!key){message('サーバー名と管理キーを入力してください');return}try{await api(`/api/instances/${encodeURIComponent(name)}`,{headers:{'X-Instance-Key':key}});remember(name,key);$('#importName').value='';$('#importKey').value='';message('サーバーを追加しました',true);await load()}catch(e){message(e.message)}}
function forgetServer(name){forget(name);load()}
load();setInterval(load,15000);
</script>
</body>
</html>
