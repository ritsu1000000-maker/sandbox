{% extends "base.html" %}
{% block title %}ログイン｜Rental Server{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <span class="page-label">CUSTOMER LOGIN</span>
    <h1>ログイン</h1>
    <p>契約中のサーバーと請求情報を管理します。</p>
    {% if error %}<div class="form-alert">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>メールアドレス<input type="email" name="email" value="{{ email }}" autocomplete="email" required></label>
      <label>パスワード<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button button-primary auth-submit" type="submit">ログイン</button>
    </form>
    <p class="auth-switch">アカウントがありませんか？ <a href="/signup">新規登録</a></p>
  </div>
</section>
{% endblock %}
