<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Rental Server{% endblock %}</title>
  <meta name="description" content="無料500MBから選べるシンプルなレンタルサーバーサービス。">
  <meta name="theme-color" content="#1768c4">
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='detail.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<div class="topline"></div>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/"><span class="brand-mark">RS</span><span class="brand-accent">RENTAL</span> SERVER</a>
    <nav class="global-nav" aria-label="メインナビゲーション">
      <a href="/" class="{% if active_page=='home' %}active{% endif %}">ホーム</a>
      <a href="/plans" class="{% if active_page=='plans' %}active{% endif %}">料金プラン</a>
      <a href="/create" class="{% if active_page=='create' %}active{% endif %}">サーバー作成</a>
      <a href="/servers" class="{% if active_page=='servers' %}active{% endif %}">マイサーバー</a>
      <a href="/import" class="{% if active_page=='import' %}active{% endif %}">サーバー追加</a>
    </nav>
    <a class="header-action" href="/servers">マイサーバー</a>
  </div>
</header>
{% block notice %}{% endblock %}
<main>{% block content %}{% endblock %}</main>
<footer>
  <div class="container footer-inner">
    <div class="brand"><span class="brand-mark">RS</span><span class="brand-accent">RENTAL</span> SERVER</div>
    <div>Simple application hosting.</div>
  </div>
</footer>
<script src="{{ url_for('static', filename='site.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
